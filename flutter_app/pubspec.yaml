name: ai_sathi_nepal
description: AI-powered multi-tool mobile application for Nepal users
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  lottie: ^3.0.0

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.0.0

  # Payment (Khalti/eSewa handled via backend API + webview)
  webview_flutter: ^4.4.2

  # QR Code
  mobile_scanner: ^5.0.0
  qr_flutter: ^4.1.0

  # Image & PDF
  image_picker: ^1.0.5
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.1
  share_plus: ^9.0.0

  # Ads
  google_mobile_ads: ^5.0.0

  # Storage & State
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Localization
  intl: any
  flutter_localizations:
    sdk: flutter

  # Utils
  url_launcher: ^6.2.2
  connectivity_plus: ^6.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^10.0.0
  permission_handler: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
